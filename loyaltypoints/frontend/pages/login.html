<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - LoyaltyPoints</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <div class="logo auth-logo">
           <span>Loyalty Points</span>
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Sign in to your LoyaltyPoints account
        </p>
        <div class="auth-logout-note">

        </div>
        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                >

            </div>


            <button type="submit" class="primary-button">
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Register
            </a>


        </p>
        <p class="auth-footer">
            <a href="../index.html">Back to Dashboard</a>
        </p>

    </div>

</div>

<script src="../js/login.js"></script>

</body>

</html>
