<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tiers - LoyaltyPoints</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<div class="sidebar">

    <div class="logo">
        Loyalty<span>Points</span>
    </div>

    <nav>

        <a href="../index.html">
            Dashboard
        </a>

        <a href="customers.html">
            Customers
        </a>

        <a href="tiers.html" class="active">
            Tiers
        </a>

        <a href="purchases.html">
            Purchases
        </a>

        <a href="ledger.html">
            Points Ledger
        </a>

    </nav>

</div>


<div class="main-content">

    <header class="topbar">

        <div>

            <h1>Tiers</h1>

            <p>
                Manage loyalty membership tiers
            </p>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            System Online

        </div>

    </header>


    <section class="welcome">

        <h2>Tier Management</h2>

        <p>
            View minimum point requirements and
            discount percentages for each loyalty tier.
        </p>

    </section>

    <section class="card">
    <h2>Add Tier</h2>

    <form id="tierForm">

        <div class="form-group">
            <label for="tierId">Tier ID</label>
            <input
                    type="number"
                    id="tierId"
                    placeholder="Enter tier ID"
                    min="1"
                    required
            >
        </div>

        <div class="form-group">
            <label for="tierName">Tier Name</label>
            <input
                    type="text"
                    id="tierName"
                    placeholder="Enter tier name"
                    required
            >
        </div>

        <div class="form-group">
            <label for="minimumPoints">Minimum Points</label>
            <input
                    type="number"
                    id="minimumPoints"
                    placeholder="Enter minimum points"
                    min="0"
                    required
            >
        </div>

        <div class="form-group">
            <label for="discountPercentage">Discount Percentage</label>
            <input
                    type="number"
                    id="discountPercentage"
                    placeholder="Enter discount percentage"
                    min="0"
                    step="0.01"
                    required
            >
        </div>

        <button type="submit" class="primary-button">
            Add Tier
        </button>

    </form>
    </section>
    <section class="card">

        <h2>Membership Tiers</h2>

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Tier Name</th>

                <th>Minimum Points</th>

                <th>Discount%</th>

            </tr>

            </thead>

            <tbody id="tierTableBody">

            </tbody>

        </table>

    </section>

</div>


<script src="../js/tiers.js"></script>

</body>

</html>
